    ProhibitionCreate:
      type: object
      description: The API supplies the PERS notice subject to VIPS.
      required:
        - driverLicenceSeized
        - effectiveDt
        - noticeServedDt
        - noticeTypeCd
        - originalCauseCd
        - policeDetachmentId
        - prohibitionNoticeNo
      properties:
        dreEvaluationCds:
          type: array
          items:
            type: string
          example: []
        driverLicenceSeized:
          type: boolean
          example: true
          description: JSON true or false.
        effectiveDt:
          type: string
          format: date
          example: "2026-11-05"
          description: Calendar date in YYYY-MM-DD format.
        incidentDtm:
          type: string
          format: date-time
          example: "2026-11-05T01:30:00-07:00"
          description: >-
            RFC 3339 date-time with seconds and Z or a numeric UTC offset.
            Fractional seconds beyond milliseconds are truncated. VIPS stores
            the instant, so reads return it with the UTC offset used by VIPS.
        noticeServedDt:
          type: string
          format: date
          example: "2026-11-05"
          description: Calendar date in YYYY-MM-DD format.
        noticeTypeCd:
          type: string
          enum: [UL, IRP, ADP]
          example: "IRP"
          description: Prohibition notice type.
        originalCauseCd:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          maxLength: 10
          example: "IRP90FAIL"
          description: For prohibitions this is a single value.  
        policeDetachmentId:
          type: integer
          format: int64
          example: 83
          description: code table value
        policeFileNo:
          type: string
          maxLength: 15
          example: "26-123456"
        prohibitionNoticeNo:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          maxLength: 12
          example: "21900123"
          description: Notice Number beginning with 21, 22, or 80-89 for Prohibitions.
