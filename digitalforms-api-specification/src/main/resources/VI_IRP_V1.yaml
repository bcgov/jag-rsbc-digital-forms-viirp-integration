openapi: 3.0.1
info:
  title: Digital Forms VI IRP
  description: Digital Forms Vehicle Impoundments and Prohibitions API, Version 1
  contact:
    name: Digital Forms VI IRP
  version: "1.0"
servers:
- url: /digitalforms-viirp/v1
paths:
  /impoundments:
    post:
      tags:
      - Impoundments
      operationId: createImpoundment
      security:
        - oauth2: []
      summary: Create impoundment
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImpoundment'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImpoundmentResponse'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/409Conflict'
  /impoundments/{noticeNo}:
    get:
      tags:
      - Impoundments
      operationId: getImpoundment
      security:
        - oauth2: []
      summary: Retrieve impoundment
      parameters:
      - name: noticeNo
        in: path
        description: notice number
        required: true
        schema:
          type: string
        example: "00900123"
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impoundment'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
  /prohibitions:
    post:
      tags:
      - Prohibitions
      operationId: createProhibition
      security:
        - oauth2: []
      summary: Create Prohibition
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProhibition'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProhibitionResponse'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/409Conflict'
  /prohibitions/{noticeNo}:
    get:
      tags:
      - Prohibitions
      operationId: getProhibition
      security:
        - oauth2: []
      summary: Retrieve prohibition
      parameters:
      - name: noticeNo
        in: path
        description: notice number
        required: true
        schema:
          type: string
        example: "21900123"
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prohibition'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
  /documents/{documentId}:
    get:
      security:
        - oauth2: []
      tags:
      - Documents
      operationId: getDocument
      summary: Download a VIPS document as PDF
      parameters:
      - name: documentId
        in: path
        description: documentId
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 102220
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: PDF document
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
  /prohibitions/{noticeNo}/documents:
    get:
      security:
        - oauth2: []
      tags:
      - Documents
      operationId: listProhibitionDocuments
      summary: List documents associated with a prohibition
      parameters:
      - name: noticeNo
        in: path
        schema:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        required: true  
        example: "21900123"
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation; an empty array means no documents are associated
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
    post:
      security:
        - oauth2: []
      tags:
      - Documents
      operationId: uploadProhibitionDocument
      summary: Upload and associate one PDF with an existing prohibition
      description: >
        Upload exactly one readable PDF with 1 to 99,999 pages in the file part (maximum 10 MiB,
        10485760 bytes). Other parts are text metadata. The total multipart request
        limit is 11 MiB. File contents are validated as PDF; the filename and supplied
        MIME type are not trusted. Password-protected files that cannot be opened
        without a password are rejected. The page count stored with the document is
        read from the PDF. Notice type and subject are determined by the API.
        Upload and association are separate writes: an error can leave a stored PDF
        or an association whose outcome is unknown. Do not retry blindly; check the
        notice document list and use the correlation ID for support. JSON/Base64 and
        raw binary request bodies are not supported.
      parameters:
      - name: noticeNo
        in: path
        description: Prohibition notice number
        required: true
        schema:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        example: "81000032"
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        description: One PDF file and its document metadata.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            encoding:
              file:
                contentType: application/pdf
        required: true
      responses:
        '201':
          description: Document uploaded and associated with the notice
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '413':
          description: File exceeds 10 MiB or the multipart request exceeds 11 MiB.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
  /impoundments/{noticeNo}/documents:
    get:
      security:
        - oauth2: []
      tags:
      - Documents
      operationId: listImpoundmentDocuments
      summary: List documents associated with an impoundment
      parameters:
      - name: noticeNo
        in: path
        description: Impoundment notice number
        required: true
        schema:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        example: "21900123"
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation; an empty array means no documents are associated
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
    post:
      security:
        - oauth2: []
      tags:
      - Documents
      operationId: uploadImpoundmentDocument
      summary: Upload and associate one PDF with an existing impoundment
      description: >
        Upload exactly one readable PDF with 1 to 99,999 pages in the file part (maximum 10 MiB,
        10485760 bytes). Other parts are text metadata. The total multipart request
        limit is 11 MiB. File contents are validated as PDF; the filename and supplied
        MIME type are not trusted. Password-protected files that cannot be opened
        without a password are rejected. The page count stored with the document is
        read from the PDF. Notice type and subject are determined by the API.
        Upload and association are separate writes: an error can leave a stored PDF
        or an association whose outcome is unknown. Do not retry blindly; check the
        notice document list and use the correlation ID for support. JSON/Base64 and
        raw binary request bodies are not supported.
      parameters:
      - name: noticeNo
        in: path
        description: Impoundment notice number
        required: true
        schema:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        example: "22013033"
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        description: One PDF file and its document metadata.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            encoding:
              file:
                contentType: application/pdf
        required: true
      responses:
        '201':
          description: Document uploaded and associated with the notice
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '413':
          description: File exceeds 10 MiB or the multipart request exceeds 11 MiB.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
  /codetables:
    get:
      tags:
      - Codetables
      operationId: getCodeTables
      security:
        - oauth2: []
      summary: Get active code table values
      description: Returns only active code values and active groups. Entries with unknown activity are excluded.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Status 200
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTablesResponse'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
  /utility/ords/ping:
    get:
      tags:
      - Utility
      operationId: pingOrds
      security:
        - oauth2: []
      summary: ORDS Health Check Ping
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/401NotAuthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'          
        '400':
          $ref: '#/components/responses/400BadRequest'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
        '500':
          $ref: '#/components/responses/500ServerError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        DIAM (Keycloak) OAuth 2.0 client credentials. Request an access token from the token URL with the
        client ID and secret issued for your environment, then send it in the Authorization header as
        "Bearer <access_token>". Tokens are short-lived; request a new token when the current one expires.
      flows:
        clientCredentials:
          tokenUrl: https://common-sso.justice.gov.bc.ca/auth/realms/Services/protocol/openid-connect/token
          scopes: {}
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Optional caller-supplied ID used to trace this request in the API logs. Must be 1-64 characters
        from A-Z, a-z, 0-9, '.', '_' and '-' (a UUID is recommended). When omitted, the API generates a
        UUID. The effective value is always returned in the X-Correlation-ID response header. An invalid
        value, or more than one X-Correlation-ID header, is rejected with 400 before authentication.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: 3f2b8c4e-6a1d-4f7e-9b2a-1c5d8e7f9a01
  headers:
    Location:
      description: >-
        URI reference for retrieving the created resource with GET. Resolve it against the request URL.
        Notice URLs use the notice number; document URLs use the document ID.
      required: true
      schema:
        type: string
        format: uri-reference
        minLength: 1
    X-Correlation-ID:
      description: >-
        Correlation ID for this request: the supplied X-Correlation-ID request header, or a generated
        UUID when the header was omitted or rejected.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]{1,64}$'
  responses:
    400BadRequest:
      description: Bad Request. Validation failures include structured field errors, including invalid X-Correlation-ID headers.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    401NotAuthorized:
      description: >-
        The access token is missing, invalid or expired. The WWW-Authenticate header gives the reason.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        WWW-Authenticate:
          description: >-
            RFC 6750 Bearer challenge, for example: Bearer realm="DigitalForms - VI IRP API",
            error="invalid_token", error_description="Jwt expired at 2026-01-01T00:00:00Z". The
            error attributes are omitted when no token was sent.
          required: true
          schema:
            type: string
            pattern: '^Bearer( |$)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    403Forbidden:
      description: Forbidden.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    404NotFound:
      description: Not Found.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    500ServerError:
      description: Internal VI/IRP processing or authentication-infrastructure error. Details are not exposed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    502BadGateway:
      description: VIPS WS/ORDS returned an invalid or failed response. Upstream details are not exposed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    503ServiceUnavailable:
      description: >-
        VIPS WS/ORDS is unreachable or temporarily unavailable, including upstream HTTP 429/503.
        Retry-After advises when to try again, not whether a write is safe to repeat.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        Retry-After:
          description: >-
            Delay in seconds or an HTTP date. A valid upstream Retry-After is retained;
            otherwise the API advises 30 seconds. This is not a recovery guarantee.
          required: true
          schema:
            type: string
          example: "30"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    504GatewayTimeout:
      description: >-
        VIPS WS/ORDS timed out, including the VIPS GET retry time budget or upstream HTTP 408/504.
        A timed-out write may already have committed; do not blindly repeat it.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    406NotAcceptable:
      description: The requested response media type is not supported.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    409Conflict:
      description: A notice with this number already exists. Use the GET endpoint to retrieve it.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    415UnsupportedMediaType:
      description: The request media type is not supported by this operation.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegistrationCreate:
      type: object
      description: Provide at least one nonblank value in firstGivenNm, secondGivenNm, surnameNm, or organizationNm. The API returns 400 if none is supplied.
      required:
        - addresses
        - dataSourceCd
        - registrationRoleCd
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressCreate'
        dataSourceCd:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          maxLength: 4
          example: "VIPS"
          description: Current values are "VIPS" (manual), "ICBC" (coming from divers). May need a new code for DF??
        firstGivenNm:
          type: string
          maxLength: 35
          example: "JANE"
        icbcEnterpriseId:
          type: string
          maxLength: 50
          description: May not be fillable in the field. 
        licence:
          $ref: '#/components/schemas/LicenceCreate'
        organizationNm:
          type: string
          maxLength: 200
          example: "ACME LEASING LTD"
        registrationRoleCd:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          maxLength: 10
          example: "DRVR"
        secondGivenNm:
          type: string
          maxLength: 35
          example: "MARIE"
        surnameNm:
          type: string
          maxLength: 35
          example: "DOE"
        thirdGivenNm:
          type: string
          maxLength: 35
          example: "ANNE"
    Address:
      type: object
      nullable: true
      required:
        - registrationAddressTypeCd 
      properties:
        additionalDeliveryLineTxt:
          type: string
          nullable: true
          maxLength: 100
        addressFirstLineTxt:
          type: string
          nullable: true
          maxLength: 100
        addressSecondLineTxt:
          type: string
          nullable: true
          maxLength: 100
        addressThirdLineTxt:
          type: string
          nullable: true
          maxLength: 100
        cityNm:
          type: string
          nullable: true
          maxLength: 35
        countryNm:
          type: string
          nullable: true
          maxLength: 3
          description: code table value
        postalCodeTxt:
          type: string
          nullable: true
          maxLength: 10
        provinceCd:
          type: string
          nullable: true
          maxLength: 2
          description: code table value
        registrationAddressTypeCd:
          type: string
          maxLength: 10
