# Digital Forms VI IRP API Application properties. 
# Note: Values prefixed with $ are externalized values and must be set via OS Secrets or if running locally 
# using environmental variables with same name. 
   
management:
  endpoint:
    health:
      show-components: never
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    defaults:
      enabled: false
    build:
      enabled: true
    java:
      enabled: true
        
server:
  port: 8082
  tomcat:
    # Drain rejected uploads up to this bound so clients can receive the 413 response.
    max-swallow-size: 12MB
  servlet:
    context-path: /digitalforms-viirp/v1

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # Callers authenticate with a DIAM (Keycloak) client-credentials access token: Authorization: Bearer <token>.
  # Tokens are validated locally (signature, issuer, expiry, typ and the azp allow-list below); DIAM is only
  # contacted to download its public signing keys, which are fetched on first use and cached.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DIGITALFORMS_OAUTH2_ISSUER_URI:https://common-sso.justice.gov.bc.ca/auth/realms/Services}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
          # Optional comma-separated values; when set, the token aud claim must contain at least one of them.
          audiences: ${DIGITALFORMS_OAUTH2_AUDIENCE:}
    
# VIPS ORDS CLIENT properties
vips:
  rest-api:
    url: ${DIGITALFORMS_VIPSAPI_URL:}
    password: ${DIGITALFORMS_VIPSAPI_PASSWORD:}
    username: ${DIGITALFORMS_VIPSAPI_USERNAME:}
    credentials: 
      guid: ${DIGITALFORMS_VIPSAPI_CREDS_GUID:}
      user: ${DIGITALFORMS_VIPSAPI_CREDS_USER:}
      displayname: ${DIGITALFORMS_VIPSAPI_CREDS_DISPLAYNAME:}
    timeout: ${DIGITALFORMS_VIPSAPI_TIMEOUT:10000}
    retry:
      # The maximum number of retry attempts to allow
      count: ${DIGITALFORMS_VIPSAPI_RETRY_COUNT:3}
      # The Duration of the fixed delays
      delay: ${DIGITALFORMS_VIPSAPI_RETRY_DELAY:5}
      # Total milliseconds a GET may take including retries (0 = no limit); keep under the 30s route timeout.
      # Only GET/HEAD are retried; POSTs are never re-sent.
      max-duration: ${DIGITALFORMS_VIPSAPI_RETRY_MAX_DURATION:15000}
      
  client:
    basePath: ${DIGITALFORMS_VIPSORDS_BASEPATH}
    password: ${DIGITALFORMS_VIPSORDS_PASSWORD}
    username: ${DIGITALFORMS_VIPSORDS_USER}
    
digitalforms:
  app:
    version: '@project.version@'
    
  oauth2:
    # Required comma-separated DIAM client IDs (token azp claim) allowed to call the API. The DIAM realm is shared
    # with other applications and environments, so a valid signature alone is not enough. Startup fails when empty.
    allowed-client-ids: ${DIGITALFORMS_OAUTH2_ALLOWED_CLIENT_IDS:}
    
# springdoc publishes the API docs at /v3/api-docs. SPRINGDOC_APIDOCS_ENABLED=false (PROD) turns off the docs and
# Swagger UI. Setting it explicitly also silences springdoc's "enabled by default" startup warning.
# The docs use OpenAPI 3.0 to match VI_IRP_V1.yaml. springdoc defaults to 3.1, which deprecates the schema
# "example" keyword that the generated models use.
springdoc:
    default-support-form-data: true
    show-actuator: true
    api-docs:
      enabled: ${SPRINGDOC_APIDOCS_ENABLED:true}
      version: openapi_3_0
    swagger-ui:
      enabled: ${DIGITALFORMS_SWAGGER_ENABLED:false}
