version: 2
updates:
  # Java dependencies (the root pom is skipped: it references the jag-vips-client submodule)
  - package-ecosystem: "maven"
    directories:
      - "/digitalforms-api"
      - "/digitalforms-api-specification"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "18:00"

  # Dockerfile base images (pinned versions); stay on Java 21 and Maven 3
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "18:00"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
