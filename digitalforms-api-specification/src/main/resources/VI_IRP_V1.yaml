        - file_object
      properties:
        type_code:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          description: type code, example MV2687
          maxLength: 10
          example: "MV2723"
        mime_type:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          description: mime type, example application
          maxLength: 30
          example: "application"
        mime_sub_type:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          description: mime sub type, example pdf
          maxLength: 20
          example: "pdf"
        file_object:
          type: string
          pattern: '.*\S.*'
          minLength: 1
          format: byte
          description: base64-encoded file content
          example: "JVBERi0xLjQK"
        notice_type_code:
          type: string
          description: notice type code. One of IRP, ADP, UL, or IMP. 
          maxLength: 3  
          example: "IRP"
        notice_subject_code:
          type: string
          description: notice subject code. One of PERS or VEHI 
          maxLength: 4   
          example: "PERS"
