          type: integer
          format: int64
          minimum: 1
          description: Document id to attach to an impoundment or prohibition.
          example: 102220
    Problem:
      type: object
      description: >-
        RFC 9457 Problem Details. The HTTP status and problem status agree. Diagnostic
        server details are never returned. Validation failures include the errors extension.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          description: The problem type. about:blank uses the HTTP status meaning.
          example: about:blank
        title:
          type: string
          description: The HTTP status reason phrase.
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          description: A safe explanation of the failure.
          example: Request validation failed.
        instance:
          type: string
          format: uri-reference
          description: The original request path, including the context path but excluding query parameters.
          example: /digitalforms-viirp/v1/prohibitions
        errors:
          type: array
          minItems: 1
          description: Present for validation failures; fields use public request names, not Java method signatures.
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
          minLength: 1
          description: >-
            A JSON field path with dots and array indexes, a public path/query/header/part name,
            or body when the failure cannot be attributed to a field.
          example: registrations[0].licence.driverLicenceNo
        message:
          type: string
          minLength: 1
          description: Validation feedback without the rejected value or server details.
          example: must not be null
